name: release

# On a version tag: the gate (ci.yml), then the image ghcr.io/nova-globen/nova-globen-website:<tag> (and :sha-<commit>),
# pushed with the job's own token. Nothing is deployed from here: a host runs a new version when its pin moves, which
# is a change in the infrastructure that runs it. The image is built from the public repository only.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  image:
    needs: gate
    if: github.repository == 'nova-globen/nova-globen-website'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nova-globen/nova-globen-website
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v6
        env:
          # The build record this action uploads as a workflow artifact is kept three days (owner's rule D45).
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 3
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The pin a host needs: tag and digest, in the run's summary. Through env, never interpolated into the script.
      - name: Image digest
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/nova-globen/nova-globen-website:${TAG}@${DIGEST}"
          {
            echo "### Image"
            echo
            echo '```'
            echo "ghcr.io/nova-globen/nova-globen-website:${TAG}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
