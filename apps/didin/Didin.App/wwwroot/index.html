<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Didin</title>
    <base href="/" />

    <!-- The module's own Theme.css and Module.css, linked into the app at build time (Didin.App.csproj), so they match
         the markup compiled into it whatever site it points at. No web font is fetched (as on the site): Poppins is
         used when the device has it, the system's font otherwise. -->
    <link rel="stylesheet" href="css/Theme.css" />
    <link rel="stylesheet" href="css/Module.css" />
    <link rel="stylesheet" href="app.css" />
</head>

<body>
    <div id="app">Loading Didin...</div>

    <div id="blazor-error-ui" role="alert">
        An unhandled error has occurred.
        <a href="" class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
